[project]
name = "administrativo"
version = "0.1.0"
description = "Backend do Superapp Widelab (apps/administrativo)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=13.0.0",
    "alembic>=1.18.5",
    "argon2-cffi>=23.1.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.139.0",
    "openai>=2.0.0",
    "pillow>=11.0.0",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.20",
    "testcontainers[postgres]>=4.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `src` e `tests` são importáveis a partir de `backend/`, como para o uvicorn e o alembic.
pythonpath = ["."]
asyncio_mode = "auto"
# Um event loop pra sessão inteira, e não um por teste: o engine do `get_database()` é
# `lru_cache` e nasce ligado ao loop de quem o criou primeiro. Com loop por teste, o segundo
# teste herdaria um pool preso num loop já fechado.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.mypy]
python_version = "3.14"
disallow_untyped_defs = true
ignore_missing_imports = true
# `tests/` tem dois `conftest.py` (o raiz e o de `integration/`). Sem uma raiz de pacote
# explícita, o mypy os vê como o mesmo módulo `conftest` e desiste antes de checar qualquer
# coisa. Com ela, viram `tests.conftest` e `tests.integration.conftest` — os mesmos nomes que o
# `pythonpath` do pytest já dá.
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
